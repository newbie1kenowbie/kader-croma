name: Build Windows Installer (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7

      - name: Node.js 22 instellen
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Dependencies installeren
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Frontend bundelen
        run: npm run build

      - name: Express backend bundelen voor Electron
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --external:vite --outfile=electron/server.cjs

      - name: Electron & electron-builder installeren
        run: npm install --no-save --legacy-peer-deps --no-audit --no-fund electron electron-builder

      - name: Windows NSIS Installer (.exe) bouwen
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Upload Kader-Chroma-Setup.exe als Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Kader-Chroma-Windows-Installer
          path: release/*.exe

      - name: Voeg .exe toe aan GitHub Release (alleen bij tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem -Path "release" -Filter "*.exe" | ForEach-Object { $_.FullName }
          if (gh release view $tag 2>$null) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title $tag --generate-notes
          }
