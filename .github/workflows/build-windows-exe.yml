name: Build Windows Installer (.exe)

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4

      - name: Node.js 22 instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Dependencies installeren
        run: npm install --no-audit --no-fund

      - name: Frontend bundelen
        run: npm run build

      - name: Express backend bundelen voor Electron
        run: npx esbuild server.ts --bundle --platform=node --format=cjs --external:vite --outfile=electron/server.cjs

      - name: Electron & electron-builder installeren
        run: npm install --no-save --no-audit --no-fund electron electron-builder

      - name: Windows NSIS Installer (.exe) bouwen
        run: npx electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Upload Kader-Chroma-Setup.exe als Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kader-Chroma-Windows-Installer
          path: release/*.exe

      - name: Voeg .exe toe aan GitHub Release (alleen bij tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
